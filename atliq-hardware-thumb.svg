  <rect x="300" y="310" width="120" height="85" rx="6" fill="#18202d"/>
  <text x="310" y="330" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">STORAGE &amp; SSD</text>
  <text x="310" y="360" fill="#4fd1c5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">+28.4%</text>

  <rect x="435" y="310" width="120" height="85" rx="6" fill="#18202d"/>
  <text x="445" y="330" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">PERIPHERALS</text>
  <text x="445" y="360" fill="#c9a664" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">+19.1%</text>

  <rect x="570" y="310" width="120" height="85" rx="6" fill="#18202d"/>
  <text x="580" y="330" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">NETWORKING</text>
  <text x="580" y="360" fill="#48bb78" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">+14.6%</text>
</svg>
