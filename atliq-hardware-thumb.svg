  <rect x="95" y="155" width="150" height="70" rx="6" fill="#182230" stroke="rgba(79,209,197,0.3)"/>
  <text x="110" y="175" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">NET SALES (YTD)</text>
  <text x="110" y="205" fill="#4fd1c5" font-family="'Fraunces', serif" font-size="20" font-weight="bold">$192.4M</text>

  <rect x="95" y="235" width="150" height="70" rx="6" fill="#182230" stroke="rgba(201,166,100,0.3)"/>
  <text x="110" y="255" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">NET PROFIT %</text>
  <text x="110" y="285" fill="#c9a664" font-family="'Fraunces', serif" font-size="20" font-weight="bold">14.8%</text>

  <rect x="95" y="315" width="150" height="75" rx="6" fill="#182230" stroke="rgba(72,187,120,0.3)"/>
  <text x="110" y="335" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="9">FORECAST ACCURACY</text>
  <text x="110" y="365" fill="#48bb78" font-family="'Fraunces', serif" font-size="20" font-weight="bold">89.2%</text>

  <!-- Right Visual Panels -->
  <!-- Top Right Region Breakdown -->
  <rect x="280" y="110" width="440" height="140" rx="8" fill="#121620" stroke="rgba(255,255,255,0.05)"/>
  <text x="300" y="135" fill="#e8cf99" font-family="'Fraunces', serif" font-size="16">Regional Market Performance</text>
  
  <rect x="300" y="155" width="390" height="16" rx="4" fill="#1a202c"/>
  <rect x="300" y="155" width="280" height="16" rx="4" fill="#4fd1c5"/>
  <text x="305" y="167" fill="#0e1117" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">APAC: $118.2M (61.4%)</text>

  <rect x="300" y="180" width="390" height="16" rx="4" fill="#1a202c"/>
  <rect x="300" y="180" width="190" height="16" rx="4" fill="#c9a664"/>
  <text x="305" y="192" fill="#0e1117" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">EU: $48.6M (25.3%)</text>

  <rect x="300" y="205" width="390" height="16" rx="4" fill="#1a202c"/>
  <rect x="300" y="205" width="110" height="16" rx="4" fill="#48bb78"/>
  <text x="305" y="217" fill="#0e1117" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">NA: $25.6M (13.3%)</text>

  <!-- Bottom Trend Analysis -->
  <rect x="280" y="265" width="440" height="145" rx="8" fill="#121620" stroke="rgba(255,255,255,0.05)"/>
