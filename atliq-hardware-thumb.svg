<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="50%" stop-color="#0f1922"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#285e61"/>
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bg3)"/>
  <rect width="800" height="480" fill="url(#grid3)"/>

  <!-- Blobs -->
  <circle cx="200" cy="220" r="160" fill="#4fd1c5" opacity="0.08" filter="blur(60px)"/>
  <circle cx="650" cy="200" r="140" fill="#c9a664" opacity="0.08" filter="blur(60px)"/>

  <!-- Window Frame -->
  <rect x="60" y="50" width="680" height="380" rx="12" fill="#0e1117" stroke="rgba(79,209,197,0.25)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="60" y="50" width="680" height="42" rx="12" fill="#141822"/>
  <rect x="60" y="80" width="680" height="12" fill="#141822"/>
  <circle cx="85" cy="71" r="5" fill="#e05252"/>
  <circle cx="103" cy="71" r="5" fill="#e0a352"/>
  <circle cx="121" cy="71" r="5" fill="#48bb78"/>
  <text x="400" y="75" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">atliq-hardware // Power BI Executive Business Insights</text>

